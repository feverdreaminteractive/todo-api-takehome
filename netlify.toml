[build]
  publish = "public"
  functions = "netlify/functions"

# The frontend (public/) is served directly as static files, no function
# involved. Only the API paths route through the serverless function.
[[redirects]]
  from = "/todos"
  to = "/.netlify/functions/api"
  status = 200

[[redirects]]
  from = "/todos/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/health"
  to = "/.netlify/functions/api"
  status = 200
